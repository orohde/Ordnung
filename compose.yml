# Example deployment. Adjust the host paths, start it and open the page:
# the first visit (from the home network) creates the first administrator.
# Everything else is set in the app under Settings.
services:
  ordnung:
    image: ghcr.io/orohde/ordnung:latest
    container_name: ordnung
    restart: unless-stopped
    ports:
      - "${PORT:-8440}:8000"
    volumes:
      - ./archiv:/archiv      # your document folders – Ordnung! files new documents here
      - ./data:/data          # index, settings, accounts
      - ./eingang:/eingang    # optional: scanner / inbox folders
    environment:
      - TZ=Europe/Berlin
